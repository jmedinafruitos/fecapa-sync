name: release

# On every push to main, changesets/action either opens or updates the
# "Version Packages" pull request (when .changeset/ has pending changesets),
# or, once that pull request is merged, publishes the new version to npm
# with provenance. Without the NPM_TOKEN secret the publish step is skipped
# with a notice; the version pull request still works.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'jmedinafruitos/fecapa-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Is NPM_TOKEN set?
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "token=true" >> "$GITHUB_OUTPUT"
          else
            echo "token=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=npm publish skipped::The NPM_TOKEN secret is not set, so nothing is published. The Version Packages pull request is still opened or updated. See CONTRIBUTING.md (Releases)."
          fi
      - name: Version pull request, or publish to npm
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          # `changeset publish` runs `npm publish --access public` (access is
          # public in .changeset/config.json) for a version not on npm yet;
          # NPM_CONFIG_PROVENANCE adds --provenance. Empty = skip publishing.
          publish: ${{ steps.npm.outputs.token == 'true' && 'npm run release' || '' }}
          title: Version Packages
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
